# Ultralytics YOLO26-pose keypoints/pose estimation model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/pose

# Parameters
nc: 1 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
kpt_shape: [17, 3] # number of keypoints, number of dims (2 for x,y or 3 for x,y,visible)
scales: # model compound scaling constants, i.e. 'model=yolo26n-pose.yaml' will call yolo26-pose.yaml with scale 'n'
  # [depth, width, max_channels]
  # n: [0.50, 0.25, 1024] # summary: 363 layers, 3,747,554 parameters, 3,747,554 gradients, 10.7 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 363 layers, 11,870,498 parameters, 11,870,498 gradients, 29.6 GFLOPs
  # m: [0.50, 1.00, 512] # summary: 383 layers, 24,344,482 parameters, 24,344,482 gradients, 85.9 GFLOPs
  # l: [1.00, 1.00, 512] # summary: 495 layers, 28,747,938 parameters, 28,747,938 gradients, 104.3 GFLOPs
  # x: [1.00, 1.50, 512] # summary: 495 layers, 62,914,350 parameters, 62,914,350 gradients, 226.3 GFLOPs

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]          [b,3,640,640]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2     [b,64,320,320]
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4    [b,128,160,160]
  - [-1, 2, C3k2, [256, False, 0.25]]  # 深层特征提取。[b,256,160,160] 浅层特征，空间分辨率高人影 
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8   [b,256,80,80]
  - [-1, 2, C3k2, [512, False, 0.25]]  # 深层特征提取。[b,512,80,80] 中层特征，人影
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16   [b,512,40,40]
  - [-1, 2, C3k2, [512, True]]         # 深层特征提取。[b,512,40,40] 中层特征，人影
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32 [b,1024,20,20]
  - [-1, 2, C3k2, [1024, True]]        # 深层特征提取  [b,1024,20,20]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9 # [b,1024,20,20] 增强多尺度感受野,增强多尺度上下文捕捉能力 
  - [-1, 2, C2PSA, [1024]] # 10       # [b,1024,20,20] 敏感注意力机制，捕捉全局上下文建模能力和重要空间位置,捕获人体关键点之间的空间关系。深层语义特征，哪里有人，哪里有车...

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 像素复制 [b,1024,40,40]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4 # [b,1024,40,40] + [b,512,40,40] = [b,1536,40,40]融合不同层级的特征, 现跨层连接，结合高层语义和低层细节。语义信息强，空间模糊，前1024通道：告诉网络"这里是人"，后512通道：告诉网络"人的边缘在这几个像素"
  - [-1, 2, C3k2, [512, True]] # 13 [b,512,40,40]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # [b,512,80,80]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3 # 融合浅层特征 [b,512,80,80] + [b,512,80,80] = [b,1024,80,80]
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small) # 继续精炼特征 [b,256,80,80]

  - [-1, 1, Conv, [256, 3, 2]] # [b,256,40,40]
  - [[-1, 13], 1, Concat, [1]] # cat head P4 # [b,256,40,40] + [b,512,40,40] = [b,768,40,40]
  - [-1, 2, C3k2, [512, True]] # 19 (P4/16-medium) # 继续精炼特征 [b,512,40,40]

  - [-1, 1, Conv, [512, 3, 2]] # [b,512,20,20]
  - [[-1, 10], 1, Concat, [1]] # cat head P5 [b,512,20,20] + [b,1024,20,20] = [b,1536,20,20]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 (P5/32-large) # 继续精炼特征 [b,1024,20,20]

  - [[16, 19, 22], 1, Pose26, [nc, kpt_shape]] # Pose26(P3, P4, P5) [b,256,80,80]&[b,512,40,40]&[b,1024,20,20]
